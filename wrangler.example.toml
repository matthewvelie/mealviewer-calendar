# Copy this file to wrangler.toml and fill in your school's details:
#   cp wrangler.example.toml wrangler.toml
# wrangler.toml is git-ignored, so your school stays out of the repo.

name = "school-lunch-calendar"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# The last part of your school's MealViewer URL:
#   https://schools.mealviewer.com/school/LincolnES  ->  "LincolnES"
SCHOOL_ID = "YOUR-SCHOOL-ID"

# Your local time zone (IANA name), e.g. "America/New_York", "America/Denver", "America/Los_Angeles", "Pacific/Honolulu"
TIMEZONE = "America/New_York"

# Optional: a short school name to show in event titles, e.g. "🍽 Lincoln Lunch: ..."
# SCHOOL_NAME = "Lincoln"

# Each [vars.FEEDS.<name>] section below is one calendar, at  https://<your-worker>/<name>.ics
# Names can use letters, numbers and dashes. Feeds use the SCHOOL_ID, SCHOOL_NAME and
# TIMEZONE above unless they set their own.
#
# MEAL is the menu name exactly as MealViewer shows it, e.g. "Lunch", "Elementary Lunch",
# "Breakfast", "Afternoon Snack". Visit https://<your-worker>/menus after deploying to list them.

[vars.FEEDS.lunch]
MEAL = "Lunch"

# Optional: select one cafeteria line when a school page combines multiple campuses.
# Matches the line's name, ignoring capitalization and extra spaces. A missing line
# produces no events; it never falls back to menus from another campus.
# CAFETERIA_LINE = "Selected Campus"
# Optional: keep these items in the event notes but out of the main-dish title.
# TITLE_EXCLUDE = ["Rice"]
# Optional: map a school's custom food categories to the supported groups.
# Unmapped categories keep their existing behavior (milk and condiments are omitted).
# [vars.FEEDS.lunch.TYPE_MAP]
# "Hot Food" = "ENTREES"
# "Vegetables" = "VEGETABLE"
# "Grains" = "Breads/Grains"
# "Fruits" = "FRUIT"

# Optional extra calendars. Remove the # at the start of each line to turn one on.

# [vars.FEEDS.breakfast]
# MEAL = "Breakfast"

# [vars.FEEDS.snack]
# MEAL = "Afternoon Snack"

# A kid at a different school: give the feed its own SCHOOL_ID (and SCHOOL_NAME, if you use names).
# Add as many schools as you need this way.
# [vars.FEEDS.kid2-lunch]
# SCHOOL_ID = "RooseveltMS"
# SCHOOL_NAME = "Roosevelt"
# MEAL = "Middle School Lunch"

# Optional per feed: CALENDAR_NAME (the calendar's name in your app) and EVENT_PREFIX
# (text before each event title). They default to e.g. "School Breakfast" and "🥞 Breakfast:",
# or "Lincoln Breakfast" and "🥞 Lincoln Breakfast:" when SCHOOL_NAME is set.
